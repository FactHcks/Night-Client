<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171225"/>
      <stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    <linearGradient id="ink" x1="150" y1="140" x2="362" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B26BFF"/>
      <stop offset="0.5" stop-color="#7A6BFF"/>
      <stop offset="1" stop-color="#00C8FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7A5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>


  <!-- N: glow, then the mark -->
  <path d="M168 352 V160 L344 352 V160" fill="none" stroke="url(#ink)" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M168 352 V160 L344 352 V160" fill="none" stroke="url(#ink)" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small star -->
  <path d="M398 108 Q401 125 418 128 Q401 131 398 148 Q395 131 378 128 Q395 125 398 108 Z" fill="#E6F7FF" opacity="0.9"/>
</svg>
